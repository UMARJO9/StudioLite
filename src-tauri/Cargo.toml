[package]
name = "studiolite"
version = "0.1.0"
description = "Lightweight control panel for Android projects"
authors = ["mehvar"]
edition = "2024"

[lib]
# The `_lib` suffix is necessary to make the lib name unique and not conflict
# with the bin name on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "studiolite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt"] }
thiserror = "2"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
