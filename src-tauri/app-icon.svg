<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d42"/>
      <stop offset="1" stop-color="#1e1f22"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a94ff"/>
      <stop offset="1" stop-color="#2f66dc"/>
    </linearGradient>
  </defs>
  <!-- macOS icon grid: 824px tile centred in a 1024px canvas -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6"/>
  <!-- phone -->
  <rect x="338" y="208" width="348" height="608" rx="64" fill="#17181a" stroke="#dfe1e5" stroke-width="34"/>
  <rect x="462" y="250" width="100" height="16" rx="8" fill="#dfe1e5" fill-opacity="0.55"/>
  <!-- run -->
  <path d="M462 420 L462 604 L612 512 Z" fill="url(#play)" stroke="url(#play)" stroke-width="30" stroke-linejoin="round"/>
</svg>
